services:
  postgres:
    image: postgres:16-alpine
    container_name: managent-postgres
    environment:
      POSTGRES_DB: managent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d managent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - managent-postgres-data:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: managent-gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MANAGENT_CONFIG: /app/config/managent.docker.json
      MANAGENT_DATABASE_URL: postgres://postgres:postgres@postgres:5432/managent?sslmode=disable
      MANAGENT_PORT: "8080"
    ports:
      - "8081:8080"

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    container_name: managent-dashboard
    depends_on:
      gateway:
        condition: service_started
    environment:
      MANAGENT_API_BASE_URL: http://gateway:8080
      MANAGENT_ADMIN_TOKEN: managent-admin-demo
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      # - managent-dashboard-node-modules:/app/node_modules
      - managent-dashboard-next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  managent-postgres-data:
  # managent-dashboard-node-modules:
  managent-dashboard-next:
